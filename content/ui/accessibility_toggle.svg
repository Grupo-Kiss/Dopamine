<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="440" height="150" viewBox="0 0 440 150" role="img" aria-label="Accessibility toggle — off and on states">
<title>Accessibility toggle — off and on states</title>

<rect width="440" height="150" fill="#0a0a0c"/>
<text x="24" y="30" font-family="Public Sans" font-size="11" font-weight="600" fill="#4b535d" letter-spacing="1.6">OFF — full motion</text>

<g transform="translate(24 44) scale(1)">
  <circle cx="10" cy="10" r="9.4" fill="none" stroke="#6e7681" stroke-width="1.5"/>
  <circle cx="10" cy="5.6" r="1.8" fill="#6e7681"/>
  <path d="M4.4 9.2 H15.6 M10 9.2 V13 M10 13 l-3 4.2 M10 13 l3 4.2" stroke="#6e7681" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <text x="26" y="14.5" font-family="Public Sans" font-size="13" font-weight="400" fill="#6e7681">Accessibility</text>
  <rect x="125.7" y="3" width="30" height="15" rx="7.5" fill="#242b34" stroke="#39414d" stroke-width="1"/>
  <circle cx="133.7" cy="10.5" r="5.4" fill="#6e7681"/>
</g>
<text x="24" y="100" font-family="Public Sans" font-size="11" font-weight="600" fill="#4b535d" letter-spacing="1.6">ON — reduced motion (never a light theme)</text>

<g transform="translate(24 114) scale(1)">
  <circle cx="10" cy="10" r="9.4" fill="none" stroke="#6e7681" stroke-width="1.5"/>
  <circle cx="10" cy="5.6" r="1.8" fill="#6e7681"/>
  <path d="M4.4 9.2 H15.6 M10 9.2 V13 M10 13 l-3 4.2 M10 13 l3 4.2" stroke="#6e7681" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <text x="26" y="14.5" font-family="Public Sans" font-size="13" font-weight="400" fill="#6e7681">Accessibility</text>
  <rect x="125.7" y="3" width="30" height="15" rx="7.5" fill="#6e40c9" stroke="#39414d" stroke-width="1"/>
  <circle cx="147.7" cy="10.5" r="5.4" fill="#e9d5ff"/>
</g>
</svg>
