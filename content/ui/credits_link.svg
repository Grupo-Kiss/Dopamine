<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="300" height="120" viewBox="0 0 300 120" role="img" aria-label="Credits link treatment">
<title>Credits link treatment</title>

<rect width="300" height="120" fill="#0a0a0c"/>
<text x="20" y="26" font-family="Public Sans" font-size="10" font-weight="600" fill="#4b535d" letter-spacing="1.8">REST</text>

<g>
  <text x="20" y="52" font-family="Public Sans" font-size="13" font-weight="400" fill="#6e7681" text-anchor="start">Credits</text>
  <path d="M20 55.9 H70.05" stroke="#4b535d" stroke-width="1"/>
</g>
<text x="20" y="88" font-family="Public Sans" font-size="10" font-weight="600" fill="#4b535d" letter-spacing="1.8">HOVER</text>
<g>
  <text x="20" y="114" font-family="Public Sans" font-size="13" font-weight="500" fill="#c9d1d9">Credits</text>
  <path d="M20 118 H70" stroke="#a371f7" stroke-width="1.2"/>
</g>
</svg>
