<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="550" height="210" viewBox="0 0 550 210" role="img" aria-label="Focus Chain banner — tier 2">
<title>Focus Chain banner — tier 2</title>
<defs>

