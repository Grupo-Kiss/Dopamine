    <path d="M-190 -50 H190 A10 10 0 0 1 200 -40 V40 A10 10 0 0 1 190 50 H-190 A10 10 0 0 1 -200 40 V-40 A10 10 0 0 1 -190 -50 Z" fill="url(#fct2-plate)"/>
