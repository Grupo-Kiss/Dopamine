<g>
  <circle cx="354" cy="76" r="25" fill="#12261e" stroke="#2a4a3c" stroke-width="1.6"/>
  <g transform="translate(343 65.5) scale(0.85)" stroke="#2ee07a" fill="none" stroke-width="2.4" stroke-linejoin="round"><path d="M13 23.5 4.6 15.4a5.6 5.6 0 1 1 8.4-7.3 5.6 5.6 0 1 1 8.4 7.3Z"/></g>
  <text x="354" y="130" font-family="Public Sans" font-size="11" font-weight="800" fill="#2ee07a" text-anchor="middle" letter-spacing="1.4">LIKE</text>
