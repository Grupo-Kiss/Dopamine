<text x="210" y="158" font-family="Public Sans" font-size="11" font-weight="500" fill="#3f7460" text-anchor="middle">playback cannot be paused — PLAY shown for completeness</text>
<text x="210" y="168" font-family="Public Sans" font-size="10.5" font-weight="600" fill="#4b535d" text-anchor="middle" letter-spacing="1.6">TRANSPORT</text>
