</g>
<text x="800" y="968" font-family="Public Sans" font-size="13" font-weight="500" fill="#4b535d" text-anchor="middle">#f5a623 to #ffce6a  ·  never a branded imitation of a real operating system</text>

<g style="mix-blend-mode:normal">
  <rect width="1600" height="1000" filter="url(#crt-noise)"/>
  <rect width="1600" height="1000" fill="url(#crt-scan)"/>
  <rect width="1600" height="1000" fill="url(#crt-aperture)"/>
