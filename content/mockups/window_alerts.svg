</g>
<g>
  <circle cx="805" cy="795" r="4.5" fill="#f8c165"/>
  <circle cx="805" cy="795" r="8.5" fill="none" stroke="#f8c165" stroke-width="1.2" stroke-opacity="0.4"/>
