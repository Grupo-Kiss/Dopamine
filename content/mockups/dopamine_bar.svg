<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 520" role="img" aria-label="Dopamine bar states">
  <rect width="420" height="520" fill="#0a0a0c"/>
  <text x="210" y="36" text-anchor="middle" font-family="Segoe UI" font-size="18" fill="#eee">Dopamine bar</text>
  <!-- high -->
  <text x="110" y="70" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#ffb347">HIGH</text>
  <rect x="80" y="90" width="60" height="360" rx="14" fill="#1a1020" stroke="#ff8c00" stroke-width="2"/>
  <rect x="88" y="120" width="44" height="320" rx="10" fill="#ff8c00"/>
  <circle cx="110" cy="120" r="30" fill="#ff8c00" opacity="0.35"/>
  <circle cx="110" cy="120" r="18" fill="#ffb347" opacity="0.5"/>
  <text x="110" y="480" text-anchor="middle" font-family="Segoe UI" font-size="12" fill="#ff8c00">orange + glow</text>
  <!-- mid -->
  <text x="210" y="70" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#c77dff">MID</text>
  <rect x="180" y="90" width="60" height="360" rx="14" fill="#1a1020" stroke="#9b5de5" stroke-width="2"/>
  <rect x="188" y="250" width="44" height="190" rx="10" fill="#e07a3d"/>
  <text x="210" y="480" text-anchor="middle" font-family="Segoe UI" font-size="12" fill="#c77dff">blend</text>
  <!-- low -->
  <text x="310" y="70" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#7b2cbf">LOW</text>
  <rect x="280" y="90" width="60" height="360" rx="14" fill="#1a1020" stroke="#5b1d8a" stroke-width="2"/>
  <rect x="288" y="390" width="44" height="50" rx="10" fill="#7b2cbf"/>
  <text x="310" y="480" text-anchor="middle" font-family="Segoe UI" font-size="12" fill="#7b2cbf">violet</text>
</svg>
