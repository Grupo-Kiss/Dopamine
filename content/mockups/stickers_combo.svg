<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" role="img" aria-label="Combo stickers juicy vs bored">
  <rect width="640" height="280" fill="#0a0a0c"/>
  <text x="160" y="40" text-anchor="middle" font-family="Segoe UI" font-size="16" fill="#eee">Juicy (fresh window)</text>
  <text x="160" y="150" text-anchor="middle" font-family="Impact" font-size="72" fill="#ffe566" stroke="#ff0080" stroke-width="3" transform="rotate(-12 160 140)">x3!!</text>
  <text x="160" y="230" text-anchor="middle" font-family="Segoe UI" font-size="12" fill="#888">scale punch · bright · loud SFX</text>
  <line x1="320" y1="40" x2="320" y2="250" stroke="#333"/>
  <text x="480" y="40" text-anchor="middle" font-family="Segoe UI" font-size="16" fill="#eee">Bored (diminishing returns)</text>
  <text x="480" y="150" text-anchor="middle" font-family="Impact" font-size="48" fill="#777" stroke="#444" stroke-width="1">x7</text>
  <text x="480" y="230" text-anchor="middle" font-family="Segoe UI" font-size="12" fill="#888">flatter · duller · thin SFX</text>
</svg>
