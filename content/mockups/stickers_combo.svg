<rect width="980" height="460" fill="#0a0a0c"/>
<text x="56" y="64" font-family="Teko" font-size="42" font-weight="600" fill="#c9d1d9" letter-spacing="4">COMBO STICKERS</text>
<text x="56" y="94" font-family="Public Sans" font-size="14" font-weight="400" fill="#6e7681">Balatro-level motion energy, not Balatro art. Over the Active Window only.</text>
<text x="56" y="146" font-family="Public Sans" font-size="13" font-weight="800" fill="#ffd24a" letter-spacing="2.6">FIRST HITS — JUICY</text>
<text x="516" y="146" font-family="Public Sans" font-size="13" font-weight="800" fill="#6e7681" letter-spacing="2.6">SAME WINDOW TOO LONG — BORED</text>
